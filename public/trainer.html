<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trainer Portal · VMKVEC Placement Training</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="logo.jpg" type="image/x-icon">
  <link rel="shortcut icon" href="logo.jpg" type="image/x-icon">
  <link rel="icon" href="logo.jpg" type="image/x-icon" sizes="16x16 32x32">
</head>
<body>
  <div id="mainHeader"></div>

  <main class="wrap" id="trainerContent">
    <!-- Rendered dynamically by JS -->
  </main>

  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/export.js"></script>
  <script>
    if (!requireAuth("trainer")) {
      // redirected
    }

    renderHeader("trainer");

    function renderTrainerMain() {
      const students = state.students;
      const subs = state.submissions;
      const attempts = state.attempts;
      const completed = attempts.filter(a => a.completed).length;
      const unique = new Set(attempts.map(a => a.studentId)).size;

      document.getElementById("trainerContent").innerHTML = `
        <div class="between" style="margin-bottom: 20px;">
          <div>
            <h1 style="margin:0 0 4px;">Trainer Dashboard</h1>
            <p class="muted" style="margin:0;">Placement training analytics, student review, and export engine.</p>
          </div>
          <button class="ghost" onclick="logout()">Logout</button>
        </div>

        <div class="grid">
          <div class="card"><div class="stat">${students.length}</div><div class="muted">Student Accounts</div></div>
          <div class="card"><div class="stat">${unique}</div><div class="muted">Students Attempted</div></div>
          <div class="card"><div class="stat">${completed}</div><div class="muted">Completed Assessments</div></div>
        </div>

        <div class="card">
          <h2 style="margin-top:0; display:flex; align-items:center; gap:8px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Consolidated Export Reports
          </h2>
          <div class="actions" style="margin-bottom:12px;">
            <button onclick="exportAllAssessmentRecords()" style="display:inline-flex; align-items:center; gap:6px;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
              Download All Records Excel
            </button>
            <button onclick="exportAllRecordsPDF()" style="display:inline-flex; align-items:center; gap:6px;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              Download All Records PDF
            </button>
            <button onclick="exportDepartmentRecords()" style="display:inline-flex; align-items:center; gap:6px;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
              Download Student Summary Excel
            </button>
          </div>
          <p class="muted" style="margin-bottom:0;">Downloads include student details, every MCQ/question, selected answer, correct answer, result, all three coding programs, submitted code, attempt number, date/time, score, strong/weak areas and review data.</p>
        </div>

        <div class="card">
          <div class="between">
            <div>
              <h2 style="margin:0 0 4px;">🏢 Company Interview Question Bank</h2>
              <p class="muted" style="margin:0;">Wipro, Infosys and TCS interview preparation material.</p>
            </div>
            <a href="company-bank.html" class="hero-btn-primary" style="text-decoration:none; padding:10px 18px;">Open Company Bank</a>
          </div>
        </div>

        <div class="card">
          <h2 style="margin-top:0;">👥 Student Accounts Management</h2>
          <p class="muted">Delete permanently removes the student account and all assessment records, marks and program submissions for that ID.</p>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Login</th>
                  <th>Name</th>
                  <th>Department</th>
                  <th>Year</th>
                  <th>Roll No</th>
                  <th>Assessments</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${students.map(s => {
                  const aa = attempts.filter(a => a.studentId === s.id);
                  return `
                    <tr>
                      <td>${s.id}</td>
                      <td>${esc(s.username)}</td>
                      <td>${esc(s.name || "Not entered")}</td>
                      <td>${esc(s.department || "-")}</td>
                      <td>${esc(s.year || "-")}</td>
                      <td>${esc(s.rollNumber || "-")}</td>
                      <td><span class="badge ${aa.length ? "done" : ""}">${aa.length}</span></td>
                      <td class="actions">
                        <button onclick="viewStudent(${s.id})">Review</button>
                        <button onclick="exportStudentRecords(${s.id})">Excel</button>
                        <button onclick="exportStudentPDF(${s.id})">PDF</button>
                        <button class="danger" onclick="deleteStudent(${s.id})">Delete</button>
                      </td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <h2 style="margin-top:0;">⏱️ All Assessment Attempts</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Student</th>
                  <th>ID</th>
                  <th>Assessment</th>
                  <th>Attempt</th>
                  <th>Score</th>
                  <th>Date & Time</th>
                  <th>Time Used</th>
                  <th>Strong</th>
                  <th>Weak</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                ${attempts.slice().reverse().map(a => `
                  <tr>
                    <td>${esc(a.studentName || a.username)}</td>
                    <td>${a.studentId}</td>
                    <td>Day ${a.day} — ${esc(curriculum[a.day - 1][0])}</td>
                    <td>${a.attemptNumber || 1}</td>
                    <td>${a.score}/${a.total} (${a.percentage}%)</td>
                    <td>${esc(a.completedAtDisplay || a.date || "")}</td>
                    <td>${Math.ceil((a.completionSeconds || 0) / 60)} min</td>
                    <td>${esc((a.strongAreas || []).join(", "))}</td>
                    <td>${esc((a.weakAreas || []).join(", "))}</td>
                    <td class="actions">
                      <button onclick="viewAttempt(${JSON.stringify(a.id)})">Review</button>
                      <button class="danger" onclick="deleteAttempt(${JSON.stringify(a.id)})">Delete</button>
                    </td>
                  </tr>
                `).join("") || "<tr><td colspan=10>No assessment attempts recorded yet.</td></tr>"}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function reviewHTML(a) {
      const st = state.students.find(x => x.id === a.studentId) || {};
      const details = getAttemptDetails(a);
      const subs = state.submissions.filter(x => x.studentId === a.studentId && x.day === a.day && (x.attemptNumber || 1) === (a.attemptNumber || 1));
      return `
        <div class="card">
          <h2>Assessment Review — Day ${a.day}</h2>
          <p>
            <b>Student:</b> ${esc(st.name || a.studentName || a.username)} · 
            <b>ID:</b> ${a.studentId} · 
            <b>Attempt:</b> ${a.attemptNumber || 1} · 
            <b>Date/Time:</b> ${esc(a.completedAtDisplay || a.date || "")}
          </p>
          <p>
            <b>Score:</b> ${a.score}/${a.total} (${a.percentage}%) · 
            <b>Time Used:</b> ${Math.ceil((a.completionSeconds || 0) / 60)} min · 
            <b>Strong:</b> ${esc((a.strongAreas || []).join(", ") || "None")} · 
            <b>Weak:</b> ${esc((a.weakAreas || []).join(", ") || "None")}
          </p>

          <h3 class="section-title">MCQ Questions & Answers</h3>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Q#</th>
                  <th>Question</th>
                  <th>Options</th>
                  <th>Student Answer</th>
                  <th>Correct Answer</th>
                  <th>Result</th>
                </tr>
              </thead>
              <tbody>
                ${details.map(d => `
                  <tr>
                    <td>${d.number}</td>
                    <td>${esc(d.question)}</td>
                    <td>${esc(d.options.map((o, i) => "ABCD"[i] + ". " + o).join(" | "))}</td>
                    <td><b>${esc(d.answer)}</b></td>
                    <td><b>${esc(d.correct)}</b></td>
                    <td><span class="badge ${d.result === "Correct" ? "done" : "danger"}">${esc(d.result)}</span></td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>

          <h3 class="section-title" style="margin-top:30px;">Programs Submitted</h3>
          ${[1, 2, 3].map(n => {
            const sub = subs.find(x => x.problem === n);
            const code = a["program" + n] || sub?.code || "";
            return `
              <div class="coding-card">
                <div class="q-title">
                  <span class="q-num">Program ${n}</span>
                  <span>${esc(a["program" + n + "Prompt"] || sub?.prompt || CODING_BANK[a.day]?.[n - 1] || "")}</span>
                </div>
                <div><b>Status:</b> <span class="badge done">${esc(sub?.status || "Submitted")}</span></div>
                <div style="margin-top:10px;">
                  <b>Submitted Python Code:</b>
                  <pre class="code">${esc(code || "No code saved")}</pre>
                </div>
                ${sub?.feedback ? `<div><b>Trainer feedback:</b> ${esc(sub.feedback)}</div>` : ""}
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function viewStudent(id) {
      const s = state.students.find(x => x.id === id);
      const a = state.attempts.filter(x => x.studentId === id);
      if (!s) return;

      const strong = [...new Set(a.flatMap(x => x.strongAreas || []))];
      const weak = [...new Set(a.flatMap(x => x.weakAreas || []))];

      document.getElementById("trainerContent").innerHTML = `
        <button class="ghost" style="margin-bottom:16px;" onclick="renderTrainerMain()">← Back to Trainer Dashboard</button>
        <div class="between">
          <h1>${esc(s.name || s.username)}</h1>
          <div class="actions">
            <button onclick="exportStudentRecords(${id})">📊 Download Excel</button>
            <button onclick="exportStudentPDF(${id})">📄 Download PDF</button>
          </div>
        </div>
        <p>
          <b>Student ID:</b> ${s.id} · 
          <b>Login:</b> ${esc(s.username)} · 
          <b>Department:</b> ${esc(s.department || "-")} · 
          <b>Year:</b> ${esc(s.year || "-")} · 
          <b>Roll No:</b> ${esc(s.rollNumber || "-")}
        </p>

        <div class="grid">
          <div class="card">
            <h2>🌟 Strong Areas</h2>
            <p>${strong.length ? strong.join(", ") : "None recorded"}</p>
          </div>
          <div class="card">
            <h2>🎯 Weak Areas</h2>
            <p>${weak.length ? weak.join(", ") : "None recorded"}</p>
          </div>
        </div>

        <div class="card">
          <h2>Every Assessment Attempt</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Assessment</th>
                  <th>Attempt</th>
                  <th>Score</th>
                  <th>Date & Time</th>
                  <th>Time</th>
                  <th>Status</th>
                  <th>Strong</th>
                  <th>Weak</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${a.slice().reverse().map(x => `
                  <tr>
                    <td>Day ${x.day} — ${esc(curriculum[x.day - 1][0])}</td>
                    <td>${x.attemptNumber || 1}</td>
                    <td>${x.score}/${x.total} (${x.percentage}%)</td>
                    <td>${esc(x.completedAtDisplay || x.date || "")}</td>
                    <td>${Math.ceil((x.completionSeconds || 0) / 60)} min</td>
                    <td><span class="badge done">Completed</span></td>
                    <td>${esc((x.strongAreas || []).join(", "))}</td>
                    <td>${esc((x.weakAreas || []).join(", "))}</td>
                    <td class="actions">
                      <button onclick="viewAttempt(${JSON.stringify(x.id)})">Review</button>
                      <button class="danger" onclick="deleteAttempt(${JSON.stringify(x.id)})">Delete</button>
                    </td>
                  </tr>
                `).join("") || "<tr><td colspan=9>No attempts recorded.</td></tr>"}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function viewAttempt(id) {
      const a = state.attempts.find(x => String(x.id) === String(id));
      if (!a) return;
      document.getElementById("trainerContent").innerHTML = `
        <button class="ghost" style="margin-bottom:16px;" onclick="viewStudent(${a.studentId})">← Back to Student Record</button>
        <div class="between">
          <h1>Complete Record Review</h1>
          <div class="actions">
            <button onclick="exportAttemptExcel(${JSON.stringify(a.id)})">📊 Download Excel</button>
            <button onclick="exportAttemptPDF(${JSON.stringify(a.id)})">📄 Download PDF</button>
            <button class="danger" onclick="deleteAttempt(${JSON.stringify(a.id)})">Delete Attempt</button>
          </div>
        </div>
        ${reviewHTML(a)}
      `;
    }

    function deleteAttempt(id) {
      const a = state.attempts.find(x => String(x.id) === String(id));
      if (!a) return;
      if (!confirm(`Delete Day ${a.day} Attempt ${a.attemptNumber || 1} for ${a.username}? This removes the complete assessment record and reopens the assessment for retake.`)) return;
      state.attempts = state.attempts.filter(x => String(x.id) !== String(id));
      state.submissions = state.submissions.filter(x => !(x.studentId === a.studentId && x.day === a.day && (x.attemptNumber || 1) === (a.attemptNumber || 1)));
      save();
      alert(`Assessment record deleted. Day ${a.day} is now open for retake.`);
      renderTrainerMain();
    }

    function deleteStudent(id) {
      const n = Number(id);
      if (!Number.isInteger(n) || n < 1 || n > 100) {
        alert("Invalid student ID.");
        return;
      }
      const st = state.students.find(x => Number(x.id) === n);
      if (!st) {
        alert("Student ID not found.");
        return;
      }
      const username = st.username || (`student${String(n).padStart(3, "0")}`);
      if (!confirm(`Delete Student ID ${n} (${username}) permanently? This will remove the student login/profile and ALL assessment attempts, marks, MCQ answers and program submissions for this student. This cannot be undone.`)) return;
      state.students = state.students.filter(x => Number(x.id) !== n);
      state.attempts = state.attempts.filter(a => Number(a.studentId) !== n);
      state.submissions = state.submissions.filter(x => Number(x.studentId) !== n);
      if (!Array.isArray(state.deletedStudentIds)) state.deletedStudentIds = [];
      if (!state.deletedStudentIds.includes(n)) state.deletedStudentIds.push(n);
      state.deletedStudentIds.sort((a, b) => a - b);
      save();
      alert(`Student ID ${n} and all of its records have been deleted.`);
      renderTrainerMain();
    }

    renderTrainerMain();
  </script>
</body>
</html>
