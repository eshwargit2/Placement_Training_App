<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Profile · VMKVEC Placement Training</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="logo.jpg" type="image/x-icon">
  <link rel="shortcut icon" href="logo.jpg" type="image/x-icon">
  <link rel="icon" href="logo.jpg" type="image/x-icon" sizes="16x16 32x32">
  <script>
    (function() {
      const t = localStorage.getItem("appTheme") || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <div id="mainHeader"></div>

  <main class="wrap">
    <div class="card login" style="max-width: 480px; margin: 20px auto;">
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
        <div style="width:44px; height:44px; border-radius:12px; background:#eff6ff; color:#2563eb; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </div>
        <div>
          <h1 style="margin:0; font-size:24px;">Student Profile</h1>
          <p class="muted" style="margin:2px 0 0;">Please enter your academic details.</p>
        </div>
      </div>

      <div class="notice" id="studentMetaBadge" style="margin-bottom:20px; font-size:13px;">
        <!-- Filled by JS -->
      </div>

      <form id="profileForm" onsubmit="event.preventDefault(); saveStudentProfile();">
        <div class="form-group">
          <label for="pname">Student Name <span class="req">*</span></label>
          <input id="pname" type="text" placeholder="Enter full name" maxlength="50" oninput="clearErr('pname')">
          <span class="field-hint">Alphabets, spaces, and dots only</span>
          <span class="field-err" id="err-pname"></span>
        </div>

        <div class="form-group">
          <label for="pdept">Department <span class="req">*</span></label>
          <input id="pdept" type="text" value="Computer Science and Engineering (CSE)" readonly style="background:#f8fafc; font-weight:600; color:#334155; cursor:default;">
          <span class="field-err" id="err-pdept"></span>
        </div>

        <div class="form-group">
          <label for="pyear">Year of Study <span class="req">*</span></label>
          <select id="pyear" onchange="clearErr('pyear')">
            <option value="4th Year">4th Year</option>
            <option value="3rd Year" selected>3rd Year</option>
            <option value="2nd Year">2nd Year</option>
            <option value="1st Year">1st Year</option>
          </select>
          <span class="field-err" id="err-pyear"></span>
        </div>

        <div class="form-group">
          <label for="proll">Roll Number <span class="req">*</span></label>
          <input id="proll" type="text" placeholder="e.g. 01, 25, or 21CS045" maxlength="25" oninput="clearErr('proll')">
          <span class="field-hint">Enter your student roll number (digits or alphanumeric)</span>
          <span class="field-err" id="err-proll"></span>
        </div>

        <div id="formActions" style="margin-top:24px; display:flex; gap:12px;">
          <button type="submit" style="flex:1; padding:14px; font-size:15px;">💾 Save & Continue</button>
        </div>
      </form>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script>
    if (!requireAuth("student")) {
      // redirected by requireAuth
    }

    renderHeader("profile");

    const user = state.user || {};
    document.getElementById("studentMetaBadge").innerHTML = `
      Student ID: <b>${esc(user.id)}</b> &nbsp;|&nbsp; Login: <b>${esc(user.username)}</b>
    `;

    if (user.name) document.getElementById("pname").value = user.name;
    if (user.year) document.getElementById("pyear").value = user.year;
    if (user.rollNumber) document.getElementById("proll").value = user.rollNumber;

    if (user.profileCompleted) {
      const cancelBtn = document.createElement("a");
      cancelBtn.href = "dashboard.html";
      cancelBtn.className = "ghost";
      cancelBtn.style.cssText = "padding:14px 20px; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; border-radius:10px;";
      cancelBtn.textContent = "Cancel";
      document.getElementById("formActions").appendChild(cancelBtn);
    }

    function clearErr(id) {
      const el = document.getElementById(id);
      const err = document.getElementById("err-" + id);
      if (el) el.classList.remove("input-invalid");
      if (err) err.textContent = "";
    }

    function setErr(id, msg) {
      const el = document.getElementById(id);
      const err = document.getElementById("err-" + id);
      if (el) {
        el.classList.add("input-invalid");
        el.focus();
      }
      if (err) err.textContent = msg;
    }

    function saveStudentProfile() {
      const nameEl = document.getElementById("pname");
      const deptEl = document.getElementById("pdept");
      const yearEl = document.getElementById("pyear");
      const rollEl = document.getElementById("proll");

      const name = nameEl ? nameEl.value.trim() : "";
      const department = deptEl ? deptEl.value.trim() : "Computer Science and Engineering (CSE)";
      const year = yearEl ? yearEl.value.trim() : "3rd Year";
      const roll = rollEl ? rollEl.value.trim() : "";

      let hasError = false;

      // Validate Name (alphabets, spaces, dots, min 2, max 50)
      const nameRegex = /^[a-zA-Z\s.']{2,50}$/;
      if (!name) {
        setErr("pname", "Student name is required.");
        hasError = true;
      } else if (!nameRegex.test(name)) {
        setErr("pname", "Name must contain only alphabetic letters, dots, and spaces (no numbers or symbols).");
        hasError = true;
      } else {
        clearErr("pname");
      }

      // Validate Roll Number (allow digits e.g. 1, 01, 25 or alphanumeric e.g. 21CS045)
      const rollRegex = /^[a-zA-Z0-9_-]{1,25}$/;
      if (!roll) {
        setErr("proll", "Roll number is required.");
        hasError = true;
      } else if (!rollRegex.test(roll)) {
        setErr("proll", "Please enter a valid roll number (digits or alphanumeric).");
        hasError = true;
      } else {
        clearErr("proll");
      }

      if (hasError) return;

      let s = state.students.find(x => x.id === state.user.id);
      if (!s) {
        s = state.user;
        state.students.push(s);
      }
      Object.assign(s, { name, department, year, rollNumber: roll, profileCompleted: true });
      state.user = s;
      save();
      window.location.href = "dashboard.html";
    }
  </script>
</body>
</html>
